name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java Setup
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter Setup
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Recreate Android Project Template
        run: |
          flutter create --platforms=android --org com.newsapp --project-name telugu_news_bot .

      # ఇంటర్నెట్ పర్మిషన్ యాడ్ చేసే కోడ్ ఇది:
      - name: Add Internet Permission
        run: |
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Update Target Android SDK
        run: |
          sed -i 's/targetSdkVersion .*/targetSdkVersion 34/' android/app/build.gradle
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/' android/app/build.gradle

      - name: Get Packages
        run: flutter pub get

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: news-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
